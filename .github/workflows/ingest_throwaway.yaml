name: daily ingest (throwaway test)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv run python daily_ingest_throwaway.py --days 7
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRICE_AREA: ${{ vars.PRICE_AREA }}